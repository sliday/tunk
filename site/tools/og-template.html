<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    display:flex;
    background:#101317;
    color:#F2F5F8;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .left{
    width:660px;
    padding:66px 54px 60px 68px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    position:relative;
    z-index:2;
  }
  .brand{display:flex;align-items:center;gap:16px}
  .brand img{width:60px;height:60px;border-radius:14px;display:block}
  .brand span{font-size:34px;font-weight:660;letter-spacing:-.03em}

  h1{
    font-size:74px;
    line-height:1.02;
    letter-spacing:-.045em;
    font-weight:660;
    text-wrap:balance;
    margin-top:22px;
  }
  .sub{
    margin-top:22px;
    font-size:25px;
    line-height:1.36;
    letter-spacing:-.012em;
    color:#C3C9D1;
    max-width:20.5em;
    text-wrap:pretty;
  }
  .foot{display:flex;align-items:center;gap:14px;font-size:20px;color:#8B939D}
  .dot{width:9px;height:9px;border-radius:50%;background:#FFB020;box-shadow:0 0 0 5px rgba(255,176,32,.18)}
  .foot b{color:#F2F5F8;font-weight:600;letter-spacing:-.015em}

  .right{position:absolute;inset:0 0 0 auto;width:700px}
  .right img{width:100%;height:630px;object-fit:cover;object-position:58% 62%;display:block}
  /* fade the photo into the panel so the text never fights the image */
  .scrim{
    position:absolute;inset:0;
    background:linear-gradient(90deg,#101317 0%,#101317 42%,rgba(16,19,23,.86) 58%,rgba(16,19,23,.30) 82%,rgba(16,19,23,.12) 100%);
  }
  .edge{position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
</style>
</head>
<body>
  <div class="right"><img src="IMG_HERO"></div>
  <div class="scrim"></div>
  <div class="left">
    <div class="brand"><img src="IMG_ICON"><span>Tunk</span></div>
    <div>
      <h1>Back Tap, for your Mac.</h1>
      <p class="sub">Double-tap the body of your MacBook and it fires a keyboard shortcut, or runs any macOS Shortcut.</p>
    </div>
    <div class="foot"><span class="dot"></span><b>tunk.dev</b><span>&middot;</span><span>in development</span></div>
  </div>
  <div class="edge"></div>
</body>
</html>
