<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  Open Graph card, built to design/IDENTITY.md section 8.

  Ground is --ink-000. The mark sits on the left third at about 300 px. Wordmark
  and one sentence on the right in --ink-900. Amber appears only on the two
  strikes inside the mark and nowhere else in the image, per the restraint rule,
  which is why the status line below is plain --ink-700 and carries no dot.
  No screenshot, no browser chrome, no drop shadow on the text.
-->
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    display:flex;
    align-items:center;
    gap:72px;
    padding:0 80px;
    background:#0B0D10;
    color:#E8EAED;
    font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .mark{flex:none;width:300px;height:300px;display:block}

  .text{flex:1;min-width:0}

  .word{
    font-size:34px;
    font-weight:600;
    letter-spacing:-.03em;
    color:#9BA2AB;
  }

  h1{
    margin-top:14px;
    font-size:68px;
    line-height:1.03;
    letter-spacing:-.04em;
    font-weight:600;
    text-wrap:balance;
  }

  .sub{
    margin-top:22px;
    font-size:24px;
    line-height:1.38;
    letter-spacing:-.012em;
    color:#9BA2AB;
    max-width:19em;
    text-wrap:pretty;
  }

  .foot{
    margin-top:34px;
    font-size:20px;
    letter-spacing:-.01em;
    color:#5A616B;
  }
  .foot b{color:#9BA2AB;font-weight:600}
</style>
</head>
<body>
  <img class="mark" src="icon.svg" alt="">
  <div class="text">
    <p class="word">Tunk</p>
    <h1>Back Tap, for your Mac.</h1>
    <p class="sub">Double-tap the body of your MacBook and it fires a keyboard shortcut, or runs any macOS Shortcut.</p>
    <p class="foot"><b>tunk.dev</b> &nbsp;&middot;&nbsp; in development</p>
  </div>
</body>
</html>
