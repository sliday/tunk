<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="18" height="18">
  <title>Tunk menubar glyph — armed</title>
  <desc>Two strikes on a surface. Template image: one colour, three marks, nothing nested,
  nothing under 1.3 pt.</desc>

  <!--
  v2. The wedges from v1 are gone. Rendered at 18 pt they fused with the beats into two
  cones and the glyph read as two mountains, or a letter. They were there to block a
  range-slider reading; the unequal beat sizes do that job now and cost nothing.

  GEOMETRY (points, 18 x 18 template)
    rule   x 3.40 .. 14.60, y 10.30, h 1.30, rx 0.65
    beat 1 cx 6.25, cy 7.90, r 2.40   tangent to the rule
    beat 2 cx 12.25, cy 8.40, r 1.90  tangent to the rule
    gap between beats 1.70 pt

  WHY THE BEATS DIFFER IN SIZE
    Range-slider handles are always a matched pair. Unequal beats are not a slider, and
    the difference is small enough (2.40 vs 1.90) to read as "two taps, one heavier"
    rather than as a bouncing ball. Tangency to the rule says contact; floating above it
    would have said handles again.

  OPTICAL CENTRING (UI_STANDARD: optical over geometric)
    Bounding box is y 5.50 .. 11.60, centre 8.55. Area-weighted centroid is y 9.00, and
    that is what the placement follows. Centring the box would sit the glyph 0.45 pt high,
    because a 1.30 pt rule carries far less mass than two solid beats.
    Horizontally the marks span 3.85 .. 14.15, centre 9.00, so geometric centring is
    correct on that axis and the rule is centred to match.

  STATE DELTAS for the Swift port (Sources/TunkApp/MenuBarGlyph.swift)
    armed        this file
    idle         beats become 1.10 pt-wide rings, whole glyph at 0.45 alpha
    firing       scale the marks 1.14 about (9, 9), and add one shock arc under the rule:
                 M 4.60 13.75 A 5.20 5.20 0 0 0 13.40 13.75, width 1.40, round caps.
                 The arc belongs to movement only. Drawn in the armed state it turns the
                 two beats into a pair of eyes over a smile, which is not a joke this app
                 can afford in a menu bar.
    lost/blocked keep the existing strikeThrough(); it is better than anything I would
                 write, and the 3.6 pt cleared gutter is the reason it reads
    actionBroken keep the existing attentionMark()
  -->

  <g fill="#000000">
    <rect x="3.4" y="10.3" width="11.2" height="1.3" rx="0.65"/>
    <circle cx="6.25" cy="7.9" r="2.4"/>
    <circle cx="12.25" cy="8.4" r="1.9"/>
  </g>
</svg>
