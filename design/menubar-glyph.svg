<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="18" height="18">
  <title>Tunk menubar glyph — armed</title>
  <desc>Two impulses standing on a surface. Template image: one colour, no gradients, no
  hairlines under 1.4 pt. Read as "two beats landed on the deck", which is the gesture.</desc>

  <!--
  GEOMETRY (points, 18 x 18 template)
    rule    x 2.4 .. 15.6, y 10.30, h 1.40, rx 0.70
    beats   cx 6.10 and 11.90, cy 8.35, r 1.95  (tangent to the rule, contact not float)
    wedge   base y 6.45 at the beat's top edge, apex y 4.15, base width 1.60

  OPTICAL CENTRING (UI_STANDARD: optical over geometric)
    Bounding box runs y 4.15 .. 11.70, box centre 7.93 — 1.07 pt above the frame centre.
    Centring that box would sit the glyph visibly high, because a thin rule carries far
    less visual mass than two solid beats. Area-weighted centroid is y 9.09, which is why
    the marks sit where they do. No further nudge; the numbers already carry it.
    Horizontally the mark is symmetric, so geometric centring is correct on that axis.

  STATE DELTAS for the Swift port (Sources/TunkApp/MenuBarGlyph.swift)
    armed        this file
    idle         beats become 1.2 pt-wide rings, wedges dropped, whole glyph at 0.45 alpha
    firing       scale marks 1.14 about (9, 9) and add one arc under the right beat:
                 M 8.45 13.9 A 3.45 3.45 0 0 0 15.35 13.9, width 1.4, round caps
    lost/blocked keep the existing strikeThrough(); clear a 3.6 pt gutter first
    actionBroken keep the existing attentionMark() square at the lower right
  -->

  <g fill="#000000" fill-rule="nonzero">
    <rect x="2.4" y="10.3" width="13.2" height="1.4" rx="0.7"/>

    <circle cx="6.1" cy="8.35" r="1.95"/>
    <path d="M5.3 6.45 Q5.82 5.3 6.1 4.15 Q6.38 5.3 6.9 6.45 Z"/>

    <circle cx="11.9" cy="8.35" r="1.95"/>
    <path d="M11.1 6.45 Q11.62 5.3 11.9 4.15 Q12.18 5.3 12.7 6.45 Z"/>
  </g>
</svg>
