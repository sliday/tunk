<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Tunk — full bleed</title>
  <desc>The same artwork as icon.svg with the squircle, the transparent margin, the rim and
  the cast shadow removed, and the deck scaled to reach all four edges.

  USE THIS FOR apple-touch-icon.png AND FOR ANY MASKABLE MANIFEST ICON. iOS and Android
  apply their own corner mask. Feeding them icon.svg gives a rounded tile floating inside
  another rounded tile with a transparent gutter, which is the single most common way an
  otherwise good icon looks broken on a home screen.

  DO NOT use this in the Dock, in Finder, or in the .icns — those want icon.svg, corners
  and all.</desc>

  <defs>
    <linearGradient id="deck" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#767D88"/>
      <stop offset="0.5" stop-color="#545B65"/>
      <stop offset="1" stop-color="#3A3F47"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="0.18" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.34" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.16"/>
    </linearGradient>
    <pattern id="brush" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect y="0" width="6" height="1" fill="#FFFFFF" opacity="0.035"/>
      <rect y="3" width="6" height="1" fill="#000000" opacity="0.035"/>
    </pattern>
    <linearGradient id="emboss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.13"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="bloom">
      <stop offset="0" stop-color="#FFB020" stop-opacity="0.30"/>
      <stop offset="0.4" stop-color="#FF8A12" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FF8A12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#000000" stop-opacity="0.42"/>
      <stop offset="0.8" stop-color="#000000" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.38" cy="0.30" r="0.80">
      <stop offset="0" stop-color="#FFF4DC"/>
      <stop offset="0.42" stop-color="#FFC24D"/>
      <stop offset="0.82" stop-color="#FF8A12"/>
      <stop offset="1" stop-color="#E8620A"/>
    </radialGradient>
    <radialGradient id="spec">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1024/824 = 1.2427, about the centre. The 824 body becomes exactly 1024 wide, so
       every coordinate below is identical to icon.svg and the two stay in step. -->
  <g transform="translate(512 512) scale(1.2427) translate(-512 -512)">
    <rect x="100" y="100" width="824" height="824" fill="url(#deck)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#brush)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#sweep)"/>

    <circle cx="512" cy="500" r="300" fill="none" stroke="url(#emboss)" stroke-width="24"/>

    <circle cx="348" cy="500" r="300" fill="url(#bloom)"/>
    <circle cx="676" cy="500" r="330" fill="url(#bloom)"/>

    <circle cx="348" cy="500" r="144" fill="url(#halo)"/>
    <circle cx="348" cy="500" r="118" fill="url(#core)"/>
    <ellipse cx="308" cy="453" rx="44" ry="30" fill="url(#spec)" transform="rotate(-32 308 453)"/>

    <circle cx="676" cy="500" r="138" fill="url(#halo)"/>
    <circle cx="676" cy="500" r="112" fill="url(#core)"/>
    <ellipse cx="638" cy="455" rx="42" ry="28" fill="url(#spec)" transform="rotate(-32 638 455)"/>
  </g>
</svg>
