<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Tunk — Direction 2: Interference</title>
  <desc>Top-down view of the deck. Two tap points, each throwing a ring system; where the rings cross they brighten. Two overlapping ring fields say "double" without a hand or a finger.</desc>

  <defs>
    <clipPath id="sq">
      <path d="M381.76 100 L642.24 100 C723.42 100 763.93 100 807.60 113.81 C855.28 137.55 886.45 168.72 910.19 216.40 C924 260.07 924 300.58 924 381.76 L924 642.24 C924 723.42 924 763.93 910.19 807.60 C886.45 855.28 855.28 886.45 807.60 910.19 C763.93 924 723.42 924 642.24 924 L381.76 924 C300.58 924 260.07 924 216.40 910.19 C168.72 886.45 137.55 855.28 113.81 807.60 C100 763.93 100 723.42 100 642.24 L100 381.76 C100 300.58 100 260.07 113.81 216.40 C137.55 168.72 168.72 137.55 216.40 113.81 C260.07 100 300.58 100 381.76 100 Z"/>
    </clipPath>
    <linearGradient id="plate" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#3A4049"/>
      <stop offset="0.55" stop-color="#22262C"/>
      <stop offset="1" stop-color="#14171B"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5">
      <stop offset="0" stop-color="#FFB020" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFB020" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5">
      <stop offset="0" stop-color="#FFB020" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFB020" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#plate)"/>

    <circle cx="404" cy="512" r="300" fill="url(#glowB)"/>
    <circle cx="640" cy="512" r="300" fill="url(#glowA)"/>

    <!-- older tap, rings run wide and thin -->
    <g fill="none" stroke="#C8CDD4" stroke-linecap="round">
      <circle cx="404" cy="512" r="96"  stroke-width="16" opacity="0.34"/>
      <circle cx="404" cy="512" r="168" stroke-width="13" opacity="0.20"/>
      <circle cx="404" cy="512" r="246" stroke-width="10" opacity="0.11"/>
    </g>
    <!-- fresh tap, rings tight and hot -->
    <g fill="none" stroke="#FFB020" stroke-linecap="round">
      <circle cx="640" cy="512" r="96"  stroke-width="20" opacity="0.92"/>
      <circle cx="640" cy="512" r="168" stroke-width="15" opacity="0.52"/>
      <circle cx="640" cy="512" r="246" stroke-width="11" opacity="0.24"/>
    </g>

    <circle cx="404" cy="512" r="34" fill="#C8CDD4" opacity="0.55"/>
    <circle cx="640" cy="512" r="40" fill="#FFD98A"/>
  </g>
</svg>
