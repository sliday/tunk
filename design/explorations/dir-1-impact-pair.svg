<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Tunk — Direction 1: Impact Pair</title>
  <desc>Side elevation. Two amber impulses strike an aluminium deck; the shock spreads down into the case. The left beat is older and fainter, the right one just landed.</desc>

  <defs>
    <clipPath id="sq">
      <path d="M381.76 100 L642.24 100 C723.42 100 763.93 100 807.60 113.81 C855.28 137.55 886.45 168.72 910.19 216.40 C924 260.07 924 300.58 924 381.76 L924 642.24 C924 723.42 924 763.93 910.19 807.60 C886.45 855.28 855.28 886.45 807.60 910.19 C763.93 924 723.42 924 642.24 924 L381.76 924 C300.58 924 260.07 924 216.40 910.19 C168.72 886.45 137.55 855.28 113.81 807.60 C100 763.93 100 723.42 100 642.24 L100 381.76 C100 300.58 100 260.07 113.81 216.40 C137.55 168.72 168.72 137.55 216.40 113.81 C260.07 100 300.58 100 381.76 100 Z"/>
    </clipPath>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#313640"/>
      <stop offset="1" stop-color="#12151A"/>
    </linearGradient>
    <linearGradient id="deckTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDF0F3"/>
      <stop offset="1" stop-color="#A8AFB8"/>
    </linearGradient>
    <linearGradient id="deckBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E757E"/>
      <stop offset="1" stop-color="#2A2E34"/>
    </linearGradient>
    <linearGradient id="tailR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9A1F" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFC24D" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="tailL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9A1F" stop-opacity="0"/>
      <stop offset="1" stop-color="#FF9A1F" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="flare">
      <stop offset="0" stop-color="#FFB020" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FFB020" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="headR">
      <stop offset="0" stop-color="#FFF0CC"/>
      <stop offset="0.45" stop-color="#FFC24D"/>
      <stop offset="1" stop-color="#F2710A"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#body)"/>
    <circle cx="392" cy="620" r="220" fill="url(#flare)" opacity="0.5"/>
    <circle cx="632" cy="600" r="260" fill="url(#flare)"/>

    <path d="M382 330 C380 420 375 500 362 580 L422 580 C409 500 404 420 402 330 Z" fill="url(#tailL)"/>
    <path d="M620 190 C617 340 611 470 598 580 L666 580 C653 470 647 340 644 190 Z" fill="url(#tailR)"/>

    <circle cx="392" cy="580" r="50" fill="#FF9A1F" opacity="0.88"/>
    <circle cx="632" cy="580" r="50" fill="url(#headR)"/>

    <rect x="100" y="650" width="824" height="50" fill="url(#deckBody)"/>
    <rect x="100" y="636" width="824" height="14" fill="url(#deckTop)"/>

    <g fill="none" stroke="#FFB020" stroke-linecap="round">
      <path d="M244.6 771.3 A180 180 0 0 0 539.4 771.3" stroke-width="14" opacity="0.16"/>
      <path d="M195.4 805.8 A240 240 0 0 0 588.6 805.8" stroke-width="11" opacity="0.09"/>
      <path d="M517.3 748.4 A140 140 0 0 0 746.7 748.4" stroke-width="16" opacity="0.30"/>
      <path d="M468.2 782.8 A200 200 0 0 0 795.8 782.8" stroke-width="12" opacity="0.16"/>
