  <title>Tunk v1 — side elevation, rejected</title>
  <desc>Kept for the record. Rendered and looked at: the trails read as two candles on a
  shelf, the shock arcs read as a speaker grille, and at 16 px the whole tile is a dark
  rectangle with a warm smudge. Mean luminance measured 42/255 top half, 32/255 bottom.
  Superseded by icon.svg v2. The failure was value structure, not concept.</desc>

